name: Monthly Ibaity apartment-price update

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/scrape_ibaity.py"
      - "scripts/region_stats.py"
      - "scripts/sale_terms.py"
      - "data/governorate-history.json"
      - ".github/workflows/ibaity-price-update.yml"
  schedule:
    # Monthly on the 1st at 00:30 UTC (09:30 KST).
    - cron: "30 0 1 * *"

permissions:
  contents: write

concurrency:
  group: sise-price-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect all Baghdad apartment listings from ibaity
        run: python scripts/scrape_ibaity.py
      - name: Commit ibaity snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ibaity-latest.json data/complex-history.json data/region-history.json
          git diff --cached --quiet || git commit -m "chore: update ibaity apartment listings"
          git pull --rebase origin main
          git push
