name: Audit Ibaity sale terms

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_ibaity_terms.py"
      - ".github/workflows/ibaity-terms-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect all public list API descriptions
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from scrape_ibaity import fetch_page, clean_listing
          from audit_ibaity_terms import FINANCING, CASH
          import re
          records=[]
          for page in range(1,100):
              payload=fetch_page(page)
              for item in payload:
                  cleaned=clean_listing(item,"2026-10-01")
                  if cleaned:
                      records.append((item,cleaned))
              if len(payload)<10:break
          counts={}
          for item,row in records:
              desc=str(item.get("description") or "")
              markers=sorted(set(m.group(0).lower() for m in FINANCING.finditer(desc)))
              status="finance" if markers else "cash" if CASH.search(desc) else "unspecified" if desc.strip() else "missing"
              counts[status]=counts.get(status,0)+1
              if status == "cash":
                  print("CASH",row["id"],row["complex_key"],row["complex_name_ar"],row["price_iqd"])
              if row["price_eligible"] and status in ("finance","missing"):
                  print("FLAG",row["id"],status,",".join(markers)[:90],row["complex_key"],row["complex_name_ar"],row["price_iqd"])
          print("TOTAL",len(records),"COUNTS",counts)
          PY
