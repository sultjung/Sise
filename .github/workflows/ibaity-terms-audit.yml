name: Audit Ibaity sale terms

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_ibaity_terms.py"
      - ".github/workflows/ibaity-terms-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect detailed public listing terms
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from scrape_ibaity import fetch_page
          for page in (1, 32):
              rows=fetch_page(page)
              print("PAGE",page,"COUNT",len(rows))
              if rows:
                  row=next((x for x in rows if x.get("id")=="86BCD7"),rows[0])
                  print("ID",row.get("id"),"KEYS",sorted(row.keys()))
                  for key in ("description","details","content","title","price"):
                      print(key,repr(row.get(key))[:500])
          PY
