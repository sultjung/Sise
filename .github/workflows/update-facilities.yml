name: Update facility map data
# Facility data is refreshed automatically.

on:
  push:
    paths-ignore:
      - "data/facilities.json"
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Baghdad facilities from OpenStreetMap
        run: |
          python - <<'PY'
          import datetime, json, os, shutil, time, urllib.parse, urllib.request
          query = r'''[out:json][timeout:60];(
            node["amenity"~"school|university|college|hospital|clinic|doctors"](33.00,44.20,33.65,44.90);
            way["amenity"~"school|university|college|hospital|clinic|doctors"](33.00,44.20,33.65,44.90);
            node["school:level"](33.00,44.20,33.65,44.90);
            way["school:level"](33.00,44.20,33.65,44.90);
          );out center tags qt;'''
          endpoints = [
              "https://overpass-api.de/api/interpreter",
              "https://overpass.kumi.systems/api/interpreter",
              "https://overpass.private.coffee/api/interpreter",
          ]
          data = None
          for attempt in range(1, 4):
              for endpoint in endpoints:
                  try:
                      body = urllib.parse.urlencode({"data": query}).encode()
                      request = urllib.request.Request(endpoint, data=body, headers={"Content-Type": "application/x-www-form-urlencoded", "Accept": "application/json", "User-Agent": "sultjung-Sise-facility-updater/1.0"})
                      with urllib.request.urlopen(request, timeout=210) as response:
                          data = json.load(response)
                      if data.get("elements") is not None:
                          break
                  except Exception as error:
                      print(f"Attempt {attempt}: {endpoint} failed: {error}")
              if data is not None:
                  break
              time.sleep(5)
          if data is None:
              if os.path.exists("data/facilities.json"):
                  shutil.copyfile("data/facilities.json", "/tmp/facilities.json")
                  print("Overpass unavailable; keeping the existing facility cache.")
                  raise SystemExit(0)
              raise SystemExit("No Overpass endpoint returned facility data")
          payload = {
              "version": 1,
              "source": "OpenStreetMap Overpass API",
              "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "bbox": [33.00, 44.20, 33.65, 44.90],
              "elements": data.get("elements", [])
          }
          with open("/tmp/facilities.json", "w", encoding="utf-8") as file:
              json.dump(payload, file, ensure_ascii=False, separators=(",", ":"))
          print(f"Saved {len(payload['elements'])} facilities")
          PY
      - name: Commit updated facility data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Commit attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/facilities.json data/facilities.json
            git add data/facilities.json

            if git diff --cached --quiet; then
              echo "Facility data is already up to date."
              exit 0
            fi

            git commit -m "Update facility map data"
            if git push origin HEAD:main; then
              echo "Facility data pushed successfully."
              exit 0
            fi

            echo "Push raced with another update; retrying."
          done

          echo "Could not push facility data after 5 attempts."
          exit 1
