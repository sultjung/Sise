<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ font-family:'Inter',sans-serif; background:#F5F5F6; }
  .wrap{ max-width:1150px; margin:24px auto; }
  h1{ font-size:16px; margin-bottom:10px; color:#232428; }
  h1 span{ color:#6B6D72; font-weight:400; font-size:12px; }
  #map{ height:760px; border-radius:10px; border:1px solid #E7E7E9; }
  .legend{
    background:#fff; border:1px solid #E7E7E9; border-radius:8px; padding:10px 13px;
    font-size:11px; line-height:1.9;
  }
  .legend .sw{ display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px;}

  /* readable label: compact chip, dark text, small footprint so it doesn't cover the map */
  .region-label{
    font-family:'Inter',sans-serif; text-align:center; pointer-events:none;
    background:rgba(255,255,255,.92); border:1px solid rgba(0,0,0,.1);
    border-radius:4px; padding:1px 5px; box-shadow:0 1px 3px rgba(0,0,0,.2);
    white-space:nowrap; line-height:1.25;
  }
  .region-label .en{ font-weight:700; font-size:8.5px; letter-spacing:.2px; color:#232428; }
  .region-label .price{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:9px; color:#B23D00; }
  .cbd-label{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:9.5px; color:#fff; background:#232428; padding:2px 7px; border-radius:4px; white-space:nowrap; }
</style>

  const map = L.map('map', { scrollWheelZoom:true });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom:18
  }).addTo(map);

  function addLabel(latlng, en, price){
    L.marker(latlng, {
      icon: L.divIcon({
        className:'',
        html:`<div class="region-label"><span class="en">${en}</span> <span class="price">${price}</span></div>`,
        iconSize:null
      }),
      interactive:false
    }).addTo(map);
  }

  // districts (choropleth fill, real traced shape)
  Object.entries(districts).forEach(([key, d]) => {
    const tooltipText = d.complex
      ? `<b>${d.nameEn}</b><br>${d.complex}<br>${d.price} IQD/m²`
      : `<b>${d.nameEn}</b><br>${d.price} IQD/m²`;
    L.polygon(d.coords, {
      color:'#fff', weight:1.5,
      fillColor: tierColor[d.tier], fillOpacity:0.62
    }).addTo(map).bindTooltip(tooltipText, {sticky:true});
    addLabel(d.centroid, d.nameEn, d.price);
  });

  // green zone (CBD reference, distinct style — no price)
  L.polygon(greenZone.coords, {
    color:'#232428', weight:1.5, dashArray:'5,4',
    fillColor:'#232428', fillOpacity:0.18
  }).addTo(map);
  L.marker(greenZone.centroid, {
    icon: L.divIcon({ className:'', html:`<div class="cbd-label">GREEN ZONE · CBD</div>`, iconSize:null }),
    interactive:false
  }).addTo(map);

  // fit the view so every district (including Bismayah) is visible at the tightest possible zoom
  const allCoords = Object.values(districts).flatMap(d => d.coords).concat(greenZone.coords);
  map.fitBounds(L.latLngBounds(allCoords), { padding:[24,24] });

  // legend
  const legend = L.control({position:'bottomleft'});
  legend.onAdd = function(){
    const div = L.DomUtil.create('div','legend');
    div.innerHTML = `
      <b>m² 당 호가 수준</b><br>
      <span class="sw" style="background:#D94800"></span>1,200,000 IQD 이상<br>
      <span class="sw" style="background:#FF8A3D"></span>900,000 – 1,199,999<br>
      <span class="sw" style="background:#FFC896"></span>900,000 미만 (비스마야 포함)<br>
      <span class="sw" style="background:#232428"></span>그린존 (CBD 기준)
    `;
    return div;
  };
  legend.addTo(map);
</script>
</body>
</html>
